<svg xmlns="http://www.w3.org/2000/svg" width="428" height="250" viewBox="0 0 428 250" role="img" aria-labelledby="t">
  <title id="t">Builders Exchange of Northwest Michigan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B5A80"/>
      <stop offset="1" stop-color="#07405E"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CC27A"/>
      <stop offset="1" stop-color="#1E9A5A"/>
    </linearGradient>
  </defs>
  <rect width="428" height="250" fill="url(#bg)"/>

  <!-- Mark: roof over BX monogram -->
  <g transform="translate(214 0)">
    <path d="M-66 64 L0 22 L66 64" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="28" width="11" height="18" rx="1.5" fill="#FFFFFF"/>
    <text x="-3" y="108" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#green)">B</text>
    <text x="-6" y="108" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">X</text>
  </g>

  <!-- Wordmark -->
  <text x="214" y="153" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="2.2" fill="#FFFFFF">BUILDERS EXCHANGE</text>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <line x1="56" y1="174" x2="84" y2="174" stroke="#3CC27A" stroke-width="2"/>
    <line x1="344" y1="174" x2="372" y2="174" stroke="#3CC27A" stroke-width="2"/>
    <text x="214" y="179" text-anchor="middle" font-weight="600" font-size="13.5" letter-spacing="3.2" fill="#A9D4EA">OF NORTHWEST MICHIGAN</text>
  </g>
  <text x="214" y="218" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="11.5" letter-spacing="0.4" fill="#D5E8F2">Proudly Serving the Construction Industry Since 1959</text>
</svg>
